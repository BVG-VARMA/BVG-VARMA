<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#1b1646"/>
      <stop offset="100%" stop-color="#0d2438"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a855f7;#f472b6;#22d3ee" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#f472b6;#22d3ee;#a855f7" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- glowing orbs -->
  <g filter="url(#blur)">
    <circle cx="180" cy="90" r="90" fill="#22d3ee" opacity="0.35">
      <animate attributeName="cx" values="180;320;180" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="230" r="100" fill="#a855f7" opacity="0.35">
      <animate attributeName="cx" values="620;520;620" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="80" r="90" fill="#f472b6" opacity="0.3">
      <animate attributeName="cx" values="1020;900;1020" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating particles -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="300" r="2"><animate attributeName="cy" values="300;-10" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="300" r="1.5"><animate attributeName="cy" values="300;-10" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="300" r="2"><animate attributeName="cy" values="300;-10" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="300" r="1.5"><animate attributeName="cy" values="300;-10" dur="12s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="300" r="2"><animate attributeName="cy" values="300;-10" dur="10s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="300" r="1.5"><animate attributeName="cy" values="300;-10" dur="9s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="300" r="2"><animate attributeName="cy" values="300;-10" dur="13s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text x="600" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#name)">
    Venu Gopal Varma
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>

  <!-- rotating roles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    <text x="600" y="190" opacity="1">B.Tech CSE Student
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.21;0.25;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="190" opacity="0">Java &amp; DSA Enthusiast
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.46;0.5;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="190" opacity="0">Full-Stack Web Developer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.71;0.75;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="190" opacity="0">Accessibility &amp; Problem Solver
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.79;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="600" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#a5b4fc" letter-spacing="2">
    TURNING IDEAS INTO REAL-WORLD SOFTWARE
  </text>

  <!-- animated underline -->
  <rect x="300" y="262" width="600" height="3" rx="1.5" fill="url(#line)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
